name: CI

# 這個專案沒有構建步驟, 也沒有 bundler / linter / 測試框架。
# 能自動化的門檻有三類: JS 必須可解析、倉庫自帶的靜態資源不壞、
# 以及文案必須是繁體中文 (zh-TW, 本專案唯一的書寫語言)。
# 保持最小: 門檻少而確實會跑, 勝過一堆從不執行的檢查。
# 四個檢查腳本全部離線執行, 不抓網路。

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Syntax check
        run: |
          node --check main.js
          node --check i18n.js
          for f in scripts/*.mjs; do node --check "$f"; done

      - name: Chinese text must be Traditional (zh-TW)
        run: node scripts/check-lang.mjs

      - name: i18n dictionaries must have identical keys
        run: node scripts/check-i18n.mjs

      - name: Every texture referenced by the default (4k) tier must exist
        run: node scripts/check-assets.mjs
